<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PagePatrol report{% endblock %}</title>
<style>
  :root {
    --bg: #fafafa; --surface: #fff; --text: #1a1a1a; --muted: #666; --border: #e3e3e3;
    --error: #d93036; --warning: #b86e00; --info: #2f6fd6;
    --error-bg: #fdecec; --warning-bg: #fdf3e1; --info-bg: #e9f1fd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111; --surface: #1a1a1a; --text: #ececec; --muted: #999; --border: #2c2c2c;
      --error: #ff6b6f; --warning: #f5b947; --info: #79a8ff;
      --error-bg: #3a1b1c; --warning-bg: #3a2d14; --info-bg: #1a2a45;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; color: var(--muted); word-break: break-all; }
  .totals { display: flex; gap: 12px; margin: 20px 0 28px; flex-wrap: wrap; }
  .total { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; min-width: 110px; }
  .total b { display: block; font-size: 24px; }
  .total.error b { color: var(--error); } .total.warning b { color: var(--warning); } .total.info b { color: var(--info); }
  nav { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  nav a { padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; color: inherit; text-decoration: none; background: var(--surface); }
  section.viewport { margin-bottom: 48px; }
  section.viewport > h2 { font-size: 18px; margin: 0 0 12px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .shot { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .shot img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  .shot-toggle { display: flex; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; position: sticky; top: 0; background: var(--surface); }
  .findings { display: flex; flex-direction: column; gap: 20px; }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .group-head { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .group-head .check { font-size: 13px; color: var(--text); }
  .group-head .count { font-size: 12px; padding: 0 7px; border-radius: 999px; background: var(--border); }
  .group-head.error .count { background: var(--error-bg); color: var(--error); }
  .group-head.warning .count { background: var(--warning-bg); color: var(--warning); }
  .group-head.info .count { background: var(--info-bg); color: var(--info); }
  .group details summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 4px 0; }
  .group details .finding { margin-top: 6px; }
  .finding { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--muted); border-radius: 6px; padding: 10px 12px; }
  .finding[data-y] { cursor: pointer; }
  .finding.error { border-left-color: var(--error); } .finding.warning { border-left-color: var(--warning); } .finding.info { border-left-color: var(--info); }
  .finding .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .marker { font-weight: 600; font-size: 12px; padding: 0 6px; border-radius: 4px; color: #fff; background: var(--muted); }
  .error .marker { background: var(--error); } .warning .marker { background: var(--warning); } .info .marker { background: var(--info); }
  .check { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); }
  .finding code, .console code { font: 12px ui-monospace, Consolas, monospace; word-break: break-all; }
  .finding .meta { margin-top: 4px; color: var(--muted); font-size: 13px; }
  .empty { padding: 16px; background: var(--surface); border: 1px dashed var(--border); border-radius: 6px; color: var(--muted); }
  details.console { margin-top: 16px; }
  details.console summary { cursor: pointer; color: var(--muted); }
  .console ul { list-style: none; padding: 0; margin: 8px 0 0; }
  .console li { padding: 4px 0; border-bottom: 1px solid var(--border); }
  .console .error { color: var(--error); } .console .warning { color: var(--warning); }
  footer { color: var(--muted); font-size: 13px; }
  .status { display: inline-block; font: 600 11px/18px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .04em; padding: 0 7px; border-radius: 4px; background: var(--border); color: var(--muted); }
  .status.passed { background: #e3f5e8; color: #1a7f37; }
  .status.failed { background: var(--error-bg); color: var(--error); }
  @media (prefers-color-scheme: dark) { .status.passed { background: #16301f; color: #57d07d; } }
  nav a.failed { border-color: var(--error); }
  section.scenario { margin-bottom: 40px; }
  section.scenario > h2 { font-size: 18px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; }
  ol.steps { list-style: none; padding: 0; margin: 16px 0 0; display: flex; flex-direction: column; gap: 10px; }
  .step { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .step.failed { border-color: var(--error); }
  .step.skipped { opacity: .55; }
  .step-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .step-error { margin-top: 6px; color: var(--error); font-size: 14px; }
  .step-body { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 14px; margin-top: 10px; align-items: start; }
  @media (max-width: 700px) { .step-body { grid-template-columns: 1fr; } }
  .thumb img { display: block; width: 100%; height: auto; max-height: 240px; object-fit: cover; object-position: top; border: 1px solid var(--border); border-radius: 4px; }
  ol.actions { margin: 6px 0 0; padding-left: 22px; color: var(--muted); font-size: 13px; }
  .step > .meta { margin-top: 6px; color: var(--muted); font-size: 12px; }
  .ai { display: inline-block; font: 600 10px/16px system-ui, sans-serif; padding: 0 5px; border-radius: 4px; background: var(--info-bg); color: var(--info); letter-spacing: .03em; }
  .review { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .review.confirmed { color: var(--text); }
  .summary { margin: 0 0 16px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
  .summary.failed { color: var(--warning); }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
</main>
<script>
  document.querySelectorAll('.finding[data-y]').forEach((el) => {
    el.addEventListener('click', (event) => {
      if (event.target.closest('a')) return;
      const shot = el.closest('.layout').querySelector('.shot');
      const img = shot.querySelector('img');
      const scale = img.clientWidth / img.naturalWidth;
      shot.scrollTo({ top: Math.max(0, el.dataset.y * scale - 80), behavior: 'smooth' });
    });
  });
</script>
</body>
</html>
