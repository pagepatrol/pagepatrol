<style>body { font: 16px/1.5 sans-serif; margin: 0; padding: 16px; color: #111; background: #fff; }</style>

<body>
<main>
<h1>Busy page</h1>
<p>Right after it shows up, a script keeps the browser busy for most of a second.</p>
</main>
<script>
setTimeout(() => {
  const end = performance.now() + 900;
  while (performance.now() < end);
}, 100);
</script>
