[project]
name = "pagepatrol"
version = "0.3.0"
description = "Open-source, local-first QA agent for web pages"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "7endar" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "jinja2>=3.1",
    "keyring>=25",
    "openai>=1.60",
    "playwright>=1.48",
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.12",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/pagepatrol/pagepatrol"
Issues = "https://github.com/pagepatrol/pagepatrol/issues"

[project.scripts]
pagepatrol = "pagepatrol.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

# Spell out what goes into the sdist instead of relying on .gitignore,
# so local notes never end up in a release.
[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# The formatter owns line length.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
