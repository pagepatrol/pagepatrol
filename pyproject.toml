[project]
name = "pagepatrol"
version = "0.0.1"
description = "Open-source, local-first QA agent for web pages"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "7endar" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/pagepatrol/pagepatrol"
Issues = "https://github.com/pagepatrol/pagepatrol/issues"

[project.scripts]
pagepatrol = "pagepatrol.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
